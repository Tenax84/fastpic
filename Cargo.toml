[package]
name = "fastpic"
version = "0.1.0"
edition = "2024"
description = "Gyors, minimális memóriájú képnézegető"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["webp", "qoi", "tga", "pnm", "dds", "hdr", "ico", "png", "bmp", "jpeg", "gif"] }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image"] }
resvg = { version = "0.48.1", default-features = false, features = ["svgz", "text", "system-fonts", "memmap-fonts", "raster-images"] }
kamadak-exif = "0.6.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# A dekóderek debug buildben is legyenek gyorsak, különben a fejlesztés közbeni mérések félrevezetők.
[profile.dev.package."*"]
opt-level = 3
